[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

[workspace.dependencies]
bsh-diag = { path = "crates/bsh-diag" }
bsh-syntax = { path = "crates/bsh-syntax" }
bsh-highlight = { path = "crates/bsh-highlight" }
bsh-lang = { path = "crates/bsh-lang" }
bsh-pattern = { path = "crates/bsh-pattern" }
bsh-history = { path = "crates/bsh-history" }
bsh-runtime = { path = "crates/bsh-runtime" }
bsh-vm = { path = "crates/bsh-vm" }
bsh-sys = { path = "crates/bsh-sys" }
bsh-complete = { path = "crates/bsh-complete" }
bsh-repl = { path = "crates/bsh-repl" }
bsh-tools = { path = "crates/bsh-tools" }

libc = "0.2"
# The event loop: completion-based I/O, io_uring on Linux and IOCP on Windows.
# One thread owns the shell; the runtime supplies the wakeups (`direction.md` §2).
compio = { version = "0.19", default-features = false, features = [
    "runtime",
    # The driver. `default-features = false` above drops it, and without it
    # compio links its stub driver, which panics on the first operation.
    "io-uring",
    "io",
    "fs",
    "macros",
    "process",
    "signal",
] }
rustix = { version = "1.1", default-features = false, features = [
    "std",
    "fs",
    "pipe",
    "termios",
    "event",
    "process",
    "pty",
] }
memchr = "2"
smallvec = "1"
unicode-width = "0.2"
miette = "7"
nucleo-matcher = "0.3.1"

[profile.release]
# Interactive shell: startup latency matters more than peak throughput.
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
