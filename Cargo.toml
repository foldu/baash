[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
# Not published: the crates exist to build the binary.
publish = false

[workspace.dependencies]
gix = { version = "0.90", default-features = false, features = [
  "status",
  "sha1",
] }
baash-diag = { path = "crates/baash-diag" }
baash-syntax = { path = "crates/baash-syntax" }
baash-highlight = { path = "crates/baash-highlight" }
baash-lang = { path = "crates/baash-lang" }
baash-pattern = { path = "crates/baash-pattern" }
baash-history = { path = "crates/baash-history" }
baash-runtime = { path = "crates/baash-runtime" }
baash-vm = { path = "crates/baash-vm" }
baash-sys = { path = "crates/baash-sys" }
baash-complete = { path = "crates/baash-complete" }
baash-repl = { path = "crates/baash-repl" }
baash-tools = { path = "crates/baash-tools" }
baash-utils = { path = "crates/baash-utils" }

libc = "0.2"
# The event loop: completion-based I/O, io_uring on Linux and IOCP on Windows.
# One thread owns the shell; the runtime supplies the wakeups (`direction.md` §2).
compio = { version = "0.19", default-features = false, features = [
    "runtime",
    # The driver. `default-features = false` above drops it, and without it
    # compio links its stub driver, which panics on the first operation.
    "io-uring",
    "io",
    "fs",
    "macros",
    "process",
    "signal",
    # `compio::time` is the editor's backstop wakeup for the prompt watcher
    # (`crates/baash-repl/src/term.rs`); it is a runtime timer, not a thread.
    "time",
] }
rustix = { version = "1.1", default-features = false, features = [
    "std",
    "fs",
    "pipe",
    "termios",
    "event",
    "process",
    "pty",
] }
memchr = "2"
# The portable POSIX ERE engine: Windows' only engine, and an opt-in one on
# Unix next to the platform `regcomp` (docs/performance.md).
minrx-sys = "0.2.1"
smallvec = "1"
unicode-width = "0.2"
miette = "7"
nucleo-matcher = "0.3.1"

[profile.release]
# Interactive shell: startup latency matters more than peak throughput.
# Thin LTO with many codegen units: the local Linux loop is the one that pays
# for compiles, so it gets parallelism rather than the last few percent.
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "abort"

# The Windows binary is built by CI (`package:windows`), where a serial compile
# is acceptable and a small executable is not optional: fat LTO, one codegen
# unit, symbols stripped. `cargo build --profile windows --target
# x86_64-pc-windows-gnu -p baash` reproduces it.
[profile.windows]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"

# The same program for the edit-compile-run loop: `flake.nix` builds it as
# `windows-fast`, and `just windows-fast` puts it in `result-windows-fast`.
# Fat LTO is the one optimisation that costs minutes per link rather than
# seconds, so it is the one this drops; everything that decides *behaviour*
# (opt-level, `panic = "abort"`, the feature set) is inherited, because a fast
# build whose behaviour differs from the release build is not a fast build of
# the same program. It is not what ships, and `docs/portability.md` says so.
[profile.windows-fast]
inherits = "windows"
lto = false
codegen-units = 16
