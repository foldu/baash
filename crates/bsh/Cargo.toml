[package]
name = "bsh"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The ßhell binary"

[features]
# `bsh --features builtin-utils`: use the embedded coreutils on Linux too.
builtin-utils = ["bsh-vm/builtin-utils"]

[dependencies]
bsh-diag.workspace = true
bsh-syntax.workspace = true
bsh-highlight.workspace = true
bsh-lang.workspace = true
bsh-runtime.workspace = true
bsh-vm.workspace = true
bsh-sys.workspace = true
bsh-complete.workspace = true
bsh-repl.workspace = true
bsh-tools.workspace = true
compio.workspace = true

# A Windows `PATH` has no coreutils, so the embedded fallback is not optional
# there. The feature is still the switch; it is just on by default for this
# target.
[target.'cfg(windows)'.dependencies]
bsh-vm = { workspace = true, features = ["builtin-utils"] }
