[package]
name = "bsh-history"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Command history: a navigation ring backed by Turso"

[dependencies]
bsh-sys.workspace = true
# The store. `default-features = false` keeps mimalloc (a process-wide global
# allocator from a dependency) and full-text search out of the shell.
turso = { version = "0.8.3", default-features = false }
