[package]
name = "bsh-utils"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Embedded coreutils, so a script without a POSIX userland still runs"

[dependencies]
bsh-sys.workspace = true
# `setup_localization` installs the English catalog that the build script
# already embedded; it must be the same uucore instance the utilities use.
uucore = "0.8"
# Individual uutils binaries, not the umbrella crate: each is a small library
# with an `uumain(args) -> i32` entry point, and only the ones that are listed
# here are linked. The set is chosen for what a script actually needs on a
# system without a userland — not accreted.
uu_cat = "0.8"
uu_mkdir = "0.8"
uu_rm = "0.8"
uu_ls = "0.8"
uu_wc = "0.8"
uu_head = "0.8"
uu_tail = "0.8"
uu_tr = "0.8"
uu_seq = "0.8"
uu_sleep = "0.8"
