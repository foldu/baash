[dependencies]
# The same matcher the completion menu's fuzzy tier uses, for the same reason:
# `nucleo-matcher` has no threadpool (`DESIGN.md` §4.3), and the greedy variant
# is `O(n)` per candidate, which is what keeps a keystroke's work bounded.
nucleo-matcher.workspace = true
unicode-width.workspace = true
