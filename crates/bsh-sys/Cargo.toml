[package]
name = "bsh-sys"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Syscall boundary: fds, tty, process creation"

[dependencies]
libc.workspace = true
# Leaf syscalls the shell would otherwise hand-bind: `rustix` owns the
# `io-safety` shape, the `Errno` type and the per-architecture layouts.
rustix = { workspace = true }
