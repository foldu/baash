[package]
name = "baash-complete"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Completion candidates and ranking"

[features]
# Static per-command completion data generated from carapace (MIT): every
# command's subcommands and options with a one-line description. Opt-in in the
# `baash` binary (`--features carapace`), because the tables are about 14 MiB of
# release binary; without them the engine, the `complete` model and
# bash-completion still answer.
carapace = ["dep:baash-complete-data"]

[dependencies]
baash-syntax.workspace = true
baash-lang.workspace = true
baash-diag.workspace = true
baash-complete-data = { workspace = true, optional = true }
nucleo-matcher.workspace = true
