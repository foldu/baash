[package]
name = "baash-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Shell state: options, variables, builtin host"

[dependencies]
baash-lang.workspace = true
baash-diag.workspace = true
# Matches `-G`/`-X` operands. A leaf crate: no I/O, no state, so filtering
# costs this crate one call and no new seam.
baash-pattern.workspace = true
baash-history.workspace = true
# `printf %T` needs `strftime` with the shell's exported `TZ`, and `test`
# needs `access(2)` and the effective ids; both are syscall questions, so they
# stay behind this crate's boundary rather than pulling `libc` in here.
baash-sys.workspace = true
