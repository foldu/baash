[package]
name = "baash-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Shell state: options, variables, builtin host"

[dependencies]
baash-lang.workspace = true
baash-diag.workspace = true
# Matches `-G`/`-X` operands. A leaf crate: no I/O, no state, so filtering
# costs this crate one call and no new seam.
baash-pattern.workspace = true
baash-history.workspace = true
# The picker `baashzf` shows. The same screen `Ctrl-R` opens in the line
# editor, from the other side of the boundary.
baash-picker.workspace = true
# `printf %T` needs `strftime` with the shell's exported `TZ`, and `test`
# needs `access(2)` and the effective ids; both are syscall questions, so they
# stay behind this crate's boundary rather than pulling `libc` in here.
baash-sys.workspace = true
# The global variable table: insertion order in the entries, O(1) lookup by
# name. The same pair `baash-lang`'s associative array uses, for the same
# reason — a name is a short byte key and there are ~150 of them from the
# environment alone (`docs/performance.md`).
indexmap.workspace = true
ahash.workspace = true
