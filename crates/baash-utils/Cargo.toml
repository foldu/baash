[package]
name = "baash-utils"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Embedded coreutils, so a script without a POSIX userland still runs"

[dependencies]
baash-sys.workspace = true
# `setup_localization` installs the English catalog that the build script
# already embedded; it must be the same uucore instance the utilities use.
uucore = "0.8"
# Individual uutils binaries, not the umbrella crate: each is a small library
# with an `uumain(args) -> i32` entry point, and only the ones that are listed
# here are linked. The set is chosen for what a script actually needs on a
# system without a POSIX userland — not accreted. `docs/portability.md` §6 has
# the selection rule and the measured cost of the set.
uu_grep = "0.2"
# `grep` (0.2) and `sed` (0.3) speak `uucore` 0.10's message catalog, which is
# thread-local to *its own* uucore: a body whose catalog was not installed
# prints Fluent ids (`clap-error-unexpected-argument`) instead of English. The
# coreutils crates below are 0.8 and keep using that one.
uucore10 = { package = "uucore", version = "0.10" }
uused = { package = "sed", version = "0.3" }
findutils = "0.11"
uu_base64 = "0.8"
uu_basename = "0.8"
uu_cat = "0.8"
uu_cksum = "0.8"
uu_comm = "0.8"
uu_cp = "0.8"
uu_cut = "0.8"
uu_date = "0.8"
uu_dirname = "0.8"
uu_du = "0.8"
uu_expr = "0.8"
uu_head = "0.8"
uu_ln = "0.8"
uu_ls = "0.8"
uu_md5sum = "0.8"
uu_mkdir = "0.8"
uu_mktemp = "0.8"
uu_mv = "0.8"
uu_nl = "0.8"
uu_nproc = "0.8"
uu_od = "0.8"
uu_paste = "0.8"
uu_readlink = "0.8"
uu_realpath = "0.8"
uu_rm = "0.8"
uu_rmdir = "0.8"
uu_seq = "0.8"
uu_sha1sum = "0.8"
uu_sha256sum = "0.8"
uu_shuf = "0.8"
uu_sleep = "0.8"
uu_sort = "0.8"
uu_split = "0.8"
uu_tac = "0.8"
uu_tail = "0.8"
uu_tee = "0.8"
uu_touch = "0.8"
uu_tr = "0.8"
uu_truncate = "0.8"
uu_uniq = "0.8"
uu_wc = "0.8"
