[package]
name = "baash"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The baash binary"

[features]
# The static per-command completion tables (carapace, MIT): subcommands and
# options with descriptions, for every command carapace knows. On by default,
# because they are the difference between `git --<TAB>` working out of the box
# and needing a bash-completion script; about 14 MiB of release binary.
# `--no-default-features` builds the shell without them.
default = ["carapace"]
carapace = ["baash-complete/carapace"]
# `--features mimalloc`: the process allocator on Unix too. musl's own malloc is
# slow on the small-vector traffic a shell generates, so a static musl build
# wants this (`docs/performance.md`).
mimalloc = ["dep:mimalloc"]
# `baash --features builtin-utils`: use the embedded coreutils on Linux too.
builtin-utils = ["baash-vm/builtin-utils"]
# The bash-completion library, mounted inside the shell instead of installed.
# On by default for Windows, where a bare `baash.exe` is the whole installation
# and there is no package manager to put the library on disk; off elsewhere,
# where a distribution's copy is the one in use and the smaller binary is the
# better default. The tree is not vendored: `flake.nix` (and the dev shell)
# copies the pinned nixpkgs copy into `vendor/bash-completion/` before the
# build, and a build without it is not an error, it is a binary that carries no
# library. See `src/bash_completion.rs`.
embedded-bash-completion = ["dep:rust-embed"]

[dependencies]
baash-diag.workspace = true
baash-syntax.workspace = true
baash-highlight.workspace = true
baash-lang.workspace = true
baash-runtime.workspace = true
baash-vm.workspace = true
baash-sys.workspace = true
baash-complete.workspace = true
baash-repl.workspace = true
baash-tools.workspace = true
compio.workspace = true
gix.workspace = true
mimalloc = { version = "0.1", optional = true, default-features = false }
# `debug-embed` builds the same asset table in debug as in release, so a test
# exercises the bytes in the binary and not whatever happens to be in
# `vendor/` when it runs.
rust-embed = { version = "8", optional = true, default-features = false, features = [
    "debug-embed",
] }


# A Windows `PATH` has no coreutils, so the embedded fallback is not optional
# there. The feature is still the switch; it is just on by default for this
# target.
[target.'cfg(windows)'.dependencies]
baash-vm = { workspace = true, features = ["builtin-utils"] }
# The library is on by default on Windows, so the embedder is a plain Windows
# dependency rather than something the feature has to turn on.
rust-embed = { version = "8", default-features = false, features = ["debug-embed"] }

