[package]
name = "baash"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The baash binary"

[features]
# `--features mimalloc`: the process allocator on Unix too. musl's own malloc is
# slow on the small-vector traffic a shell generates, so a static musl build
# wants this (`docs/performance.md`).
mimalloc = ["dep:mimalloc"]
# `baash --features builtin-utils`: use the embedded coreutils on Linux too.
builtin-utils = ["baash-vm/builtin-utils"]

[dependencies]
baash-diag.workspace = true
baash-syntax.workspace = true
baash-highlight.workspace = true
baash-lang.workspace = true
baash-runtime.workspace = true
baash-vm.workspace = true
baash-sys.workspace = true
baash-complete.workspace = true
baash-repl.workspace = true
baash-tools.workspace = true
compio.workspace = true
mimalloc = { version = "0.1", optional = true, default-features = false }

# A Windows `PATH` has no coreutils, so the embedded fallback is not optional
# there. The feature is still the switch; it is just on by default for this
# target.
[target.'cfg(windows)'.dependencies]
baash-vm = { workspace = true, features = ["builtin-utils"] }

