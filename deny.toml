# `cargo deny check licenses` — the gate that keeps the license story true.
#
# baash itself is GPL-3.0-or-later (`LICENSE`). Every dependency has to be
# something that can be combined with it, and `THIRD-PARTY.md` makes claims
# about which licenses appear — this file is what makes those claims
# checkable instead of remembered. A new dependency with a license that is not
# in `allow` fails the gate, and the fix is a decision, not a silence.

[graph]
# Check every feature combination, because a feature can pull a different
# dependency (baash-utils' embedded uutils crates only exist behind one).
all-features = true

[licenses]
version = 2
# Prefer a licence we recognise over a guess from a license file's text.
confidence-threshold = 0.93

# Permissive licenses that are GPL-3.0-compatible, plus the few copyleft terms
# already in the tree. Anything else is a conversation.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unlicense",
  "CC0-1.0",
  "BSL-1.0",
  # Weak copyleft, GPL-compatible; used only as a dependency, never modified.
  "MPL-2.0",
]

# The workspace crates are GPL-3.0-or-later by design and are not published, so
# they are not the gate's business: the gate is about what comes in.
[licenses.private]
ignore = true

# `cfg_block` (0.1.1, via turso) carries `license-file = "LICENSE"` instead of
# an SPDX field, and that file is the Apache-2.0 text ("Copyright 2022 Trevor
# Gross"). A clarification names the expression so the gate stays strict —
# `hash` is xxHash32 (seed 0) of the file after newline normalisation, which is
# what cargo-deny compares against, and a wrong value is silently ignored.
[[licenses.clarify]]
crate = "cfg_block"
expression = "Apache-2.0"
license-files = [{ path = "LICENSE", hash = 0xc9663a1e }]

[sources]
# Nothing may arrive from an unpinned git branch or an unknown registry.
unknown-registry = "deny"
unknown-git = "deny"
