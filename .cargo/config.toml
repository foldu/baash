# `$( … )` captures output by redirecting descriptor 1, which is a property of
# the process rather than of a test thread: with libtest's thread pool, two
# tests that capture at the same time take each other's bytes apart — and
# libtest's own progress lines land inside a capture.
#
# `just test` runs `cargo nextest`, which gives every case its own process, so
# the constraint does not arise there and the suite runs in parallel
# (`docs/performance.md`, "The test suite: 37 s to 5 s"). This stays for
# `cargo test` itself, which is what `--doc`, `--bench` and a debugging session
# use; override it in the environment and accept the flakes.
[env]
RUST_TEST_THREADS = "1"
