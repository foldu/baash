workflow:
  rules:
    # The usual pair: run for a merge request, and for a branch with no merge request open.
    # Without the middle rule a branch with an open MR runs the pipeline twice.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages:
  - check
  - package

variables:
  GIT_DEPTH: "1"

default:
  interruptible: true

# Everything that can be a derivation is one, so this job is one command: the
# release build, `cargo fmt`, `cargo clippy`, the conformance ratchet and the
# Windows cross build are all `checks.*` (see `flake.nix`). Nothing here knows
# what a compiler needs on `PATH` — the derivations do.
check:
  stage: check
  tags: [nix]
  script:
    - nix flake check --print-build-logs

# Not a check either: 18 cases read the machine rather than the shell —
# hostname, tzdata, effective uid, wall-clock timers — so a build sandbox
# measures 2326 where a real environment measures 2344. The *binaries* here are
# the nix-built ones; only the environment is the runner's, which is the number
# `crates/baash-spec/baseline.txt` was recorded against.
conformance:
  stage: check
  tags: [nix]
  script:
    # `pkg` is not a safe name: `nix develop` exports one of its own (it is the
    # stdenv's gcc wrapper), so this uses its own.
    - BAASH_PKG=$(nix build --print-out-paths .#default)
    - export BAASH_PKG
    - nix develop --command bash -c 'LC_ALL=C BAASH_SPEC_WORKSPACE_ROOT=$PWD "$BAASH_PKG/bin/baash-spec" --shell "$BAASH_PKG/bin/baash" --spec-dir "$PWD/spec/oils" --baseline "$PWD/crates/baash-spec/baseline.txt" --list-failures --ratchet --tolerance 5'

# The one thing that is not a check. The `interactive_*` tests drive a real pty,
# and a nix build sandbox has no usable `/dev/pts`: `openpty` succeeds and reads
# then hang. This job runs on a real pty, in the same pinned toolchain the
# checks use (`nix develop` takes it from the flake).
test:
  stage: check
  tags: [nix]
  cache:
    key: "test-$CI_COMMIT_REF_SLUG"
    paths:
      - target/
  script:
    - nix develop --command cargo test --workspace --all-features

package:
  stage: package
  tags: [nix]
  script:
    - nix build .#default -o result
    - mkdir -p dist
    - cp -L result/bin/baash dist/
  artifacts:
    paths:
      - dist/

package:windows:
  stage: package
  tags: [nix]
  script:
    - nix build .#windows -o result
    - mkdir -p dist
    - cp -L result/bin/baash.exe dist/
  artifacts:
    paths:
      - dist/
