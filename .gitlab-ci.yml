workflow:
  rules:
    # The usual pair: run for a merge request, and for a branch with no merge request open.
    # Without the middle rule a branch with an open MR runs the pipeline twice.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages:
  - check
  - package

variables:
  CARGO_TERM_COLOR: always
  GIT_DEPTH: "1"

default:
  interruptible: true

# Everything is built through the flake, so every job needs the nix runner:
# untagged jobs get a bare ubuntu image with no nix daemon.
.nix-cache: &nix_cache
  cache:
    key: "$CI_JOB_NAME-$CI_COMMIT_REF_SLUG"
    paths:
      - target/

lint:
  stage: check
  tags: [nix]
  <<: *nix_cache
  script:
    - nix develop --command cargo fmt --all -- --check
    - nix develop --command cargo clippy --workspace --all-targets --all-features -- --deny warnings

test:
  stage: check
  tags: [nix]
  <<: *nix_cache
  script:
    - nix develop --command cargo test --workspace --all-features

conformance:
  stage: check
  tags: [nix]
  <<: *nix_cache
  # A ratchet, not a dashboard: this job fails the pipeline when the pass count
  # drops below crates/bsh-spec/baseline.txt. Re-record with `--record` only
  # when a drop is intended, and commit the file with the change that caused it.
  #
  # The tolerance covers one known load-sensitive case (builtin-trap's
  # "traps are cleared in subshell (started with &)" flips under parallel
  # load); narrowing it to 0 is a TODO once that race is fixed.
  #
  # Exit codes: 1 = below baseline, 2 = cannot measure (no python2/python3 for
  # the suite's helpers). The second is distinct on purpose: a runner that
  # cannot measure must not look like a shell that got worse.
  script:
    - nix develop --command cargo build -p bsh
    - nix develop --command cargo run -p bsh-spec -- --shell target/debug/bsh --ratchet --tolerance 5

package:
  stage: package
  tags: [nix]
  script:
    - nix build --print-build-logs .#default
    - mkdir -p dist
    - cp -L result/bin/bsh dist/
  artifacts:
    paths:
      - dist/
